services:
  - type: web
    name: docurecon-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_sample_docs.py && python -c "from engine.tariff_classifier import WCOTariffClassifier; WCOTariffClassifier.get()"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RENDER
        value: "true"
